<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Helper</title>
    <script>
      // Apply the dark theme before first paint; App keeps it in sync if the OS setting changes.
      // Off unless VITE_DARK_MODE=true (Vite fills this in at build time; see App.tsx).
      if ("%VITE_DARK_MODE%" === "true") {
        document.documentElement.classList.toggle(
          "dark",
          matchMedia("(prefers-color-scheme: dark)").matches,
        )
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
